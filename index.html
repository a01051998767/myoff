<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>마이오프 쉬는시간</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f6f7f9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="마이오프">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: header / scrolling view / bottom tab bar; day details open as a bottom sheet. */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --line:#e4e7ec; --fg:#1b1e24; --muted:#7a8191;
  --accent:#2f6fec; --accent-soft:#e7efff; --sun:#e5484d; --sat:#2f6fec;
  --free:#2f9e5b; --free-soft:#ddf3e4; --hatch:#eef0f3; --scrim:rgba(15,18,24,.38);
  --f-num:"Space Grotesk", ui-rounded, -apple-system, system-ui, sans-serif;
  --f-text:-apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#111318; --surface:#1a1d24; --line:#2a2f38; --fg:#eceef3; --muted:#8e95a4;
  --accent:#6a98ff; --accent-soft:#1e2a45; --sun:#ff6b70; --sat:#6a98ff;
  --free:#4fc77e; --free-soft:#173322; --hatch:#22262e; --scrim:rgba(0,0,0,.55); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#111318; --surface:#1a1d24; --line:#2a2f38; --fg:#eceef3; --muted:#8e95a4;
  --accent:#6a98ff; --accent-soft:#1e2a45; --sun:#ff6b70; --sat:#6a98ff;
  --free:#4fc77e; --free-soft:#173322; --hatch:#22262e; --scrim:rgba(0,0,0,.55); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 var(--f-text);-webkit-tap-highlight-color:transparent;overflow:hidden}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;display:flex;flex-direction:column}

/* header */
.top{display:flex;align-items:center;gap:8px;padding-block:10px 6px}
.ym{font:700 28px/1 var(--f-num);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.top .sp{flex:1}
.ibtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.ibtn:active{background:var(--line)}
.ibtn svg{width:22px;height:22px}
.ibtn.spin svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.pill{padding:7px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px}
.status{font-size:12px;color:var(--muted);padding-block:0 4px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;min-height:20px}
.status .lg{display:inline-flex;align-items:center;gap:4px}
.status .lg i{width:8px;height:8px;border-radius:50%;display:inline-block}
.status .err{color:var(--sun)}

main{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch}
.view{padding-block:4px 20px}

/* month grid */
.wk{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;font-size:12px;color:var(--muted);padding-block:4px}
.wk .s0{color:var(--sun)} .wk .s6{color:var(--sat)}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-top:1px solid var(--line);background:var(--surface);border-radius:4px}
.cell{min-height:84px;border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:3px 3px 4px;display:flex;flex-direction:column;gap:3px;text-align:left;min-width:0;position:relative}
.cell:nth-child(7n){border-right:0}
.grid.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.grid.g4 .cell{border-right:1px solid var(--line)}
.grid.g4 .cell:nth-child(4n){border-right:0}
.wk.g4{grid-template-columns:repeat(4,1fr);font:700 20px/1 var(--f-text);color:var(--fg);position:sticky;top:0;z-index:5;background:var(--bg);padding-block:8px;margin-top:-4px;border-bottom:1px solid var(--line)}
.grid.g4 .cell{min-height:70px}
.wdl{font-size:11px;color:var(--muted);margin-left:3px}
.wdl.red{color:var(--sun)} .wdl.blue{color:var(--sat)}
.cell.other{opacity:.35}
.cell.full{background:var(--free-soft)}
.cell.today{box-shadow:inset 0 0 0 2px var(--accent)}
.ctop{display:flex;align-items:baseline;gap:2px;min-width:0}
.dn{font:600 13px/1.2 var(--f-num);font-variant-numeric:tabular-nums}
.today .dn{background:var(--accent);color:#fff;border-radius:4px;padding:0 3px}
.red{color:var(--sun)} .blue{color:var(--sat)}
.lab{margin-left:auto;font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.lab.red{color:var(--sun)}
.cmid{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1}
.cbot{display:flex;gap:3px;justify-content:center}
.slot{font:600 10px/1.5 var(--f-num);font-variant-numeric:tabular-nums;padding:0 4px;border-radius:5px;background:var(--free-soft);color:var(--free);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.full .slot{background:var(--free);color:#fff}
.slot.work{background:var(--line);color:var(--fg)}
.cell .slot.work{white-space:normal;text-align:center;line-height:1.25;padding:1px 3px;word-break:keep-all}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:10px;font-size:12px;color:var(--muted)}
.legend>span{display:inline-flex;align-items:center;gap:5px}
.legend .slot{font-size:11px}
.more{font-size:10px;color:var(--muted)}
.pdot{width:6px;height:6px;border-radius:50%;display:inline-block}
.pdot.off{background:transparent!important;box-shadow:inset 0 0 0 1.5px var(--line)}

/* bottom nav */
nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);background:var(--surface);padding-block:6px 4px}
nav.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted);padding:4px 0}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current=true]{color:var(--accent)}

/* cards & lists */
.sec{margin-top:18px}
.sec h2{font-size:17px;margin:0 0 8px;display:flex;align-items:center;gap:8px;text-wrap:balance}
.sec h2 small{font-weight:400;font-size:12px;color:var(--muted)}
.card{background:var(--surface);border-radius:14px;padding:4px 14px}
.row{display:flex;align-items:center;gap:10px;padding-block:12px;border-bottom:1px solid var(--line);min-width:0}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row.col{flex-direction:column;align-items:stretch;gap:6px}
.row label.l{font-size:13px;color:var(--muted)}
.muted{color:var(--muted);font-size:13px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.btn{padding:9px 14px;border-radius:10px;background:var(--accent);color:#fff;font-weight:600;font-size:14px}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.warn{background:var(--sun);color:#fff}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=number],input[type=date],select{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%;min-width:0}
input[type=color]{width:46px;height:38px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:2px;flex:none}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two label{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--muted);min-width:0}
.tog{padding:8px 14px;border-radius:999px;border:1px solid var(--line)}
.tog.on{background:var(--accent);color:#fff;border-color:var(--accent)}
ol.steps{margin:6px 0 4px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
ol.steps li{padding-left:2px}
code{font-family:ui-monospace,Menlo,monospace;font-size:12.5px;background:var(--hatch);padding:1px 5px;border-radius:5px;word-break:break-all}


/* timeline */
.tl{margin-top:4px}
.tlr{display:grid;grid-template-columns:44px 1fr;align-items:center;gap:8px;margin-bottom:8px}
.tlr .n{font-size:12px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.track{position:relative;height:22px;border-radius:6px;background:var(--surface);box-shadow:inset 0 0 0 1px var(--line);overflow:hidden}
.track i{position:absolute;top:0;bottom:0}
.track .x{background:repeating-linear-gradient(135deg,var(--hatch) 0 4px,transparent 4px 8px)}
.track .b{opacity:.85}
.track .f{background:var(--free)}
.ticks{position:relative;height:16px;margin-left:52px;font:500 10px var(--f-num);color:var(--muted)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ev{display:flex;gap:10px;padding-block:9px;border-bottom:1px solid var(--line);align-items:baseline}
.ev:last-child{border-bottom:0}
.ev .t{font:600 13px var(--f-num);font-variant-numeric:tabular-nums;width:96px;flex:none;color:var(--muted)}
.ev .nm{flex:1;min-width:0;word-break:break-word}
.tag{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--hatch);color:var(--muted);white-space:nowrap}
.tag.g{background:var(--free-soft);color:var(--free)}

/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30;display:flex;align-items:flex-end}
.sheet{background:var(--surface);width:100%;max-height:90%;border-radius:22px 22px 0 0;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.ibtn.spin svg{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px}
.shead{display:flex;align-items:center;gap:6px;padding-block:6px 10px}
.shead .info{flex:1;display:flex;flex-direction:column;gap:4px;min-width:0}
.sdate{font-size:21px;font-weight:700}
.sbody{overflow:auto;padding-block:4px 20px;flex:1;min-height:0}
.sbody h3{font-size:15px;margin:16px 0 6px;display:flex;align-items:center;gap:6px}
.sheet .track{background:var(--bg)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:14px;z-index:50;max-width:90%}
.empty{background:var(--surface);border-radius:14px;padding:16px 14px;margin-top:12px}
.empty h2{font-size:18px;margin:0 0 6px}
</style>
</head>
<body>
<div class="app">
  <header class="top gut">
    <button class="ibtn" id="prev" aria-label="이전 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <button class="ym" id="ym" aria-label="오늘로 이동">2026.11</button>
    <button class="ibtn" id="next" aria-label="다음 달"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <span class="sp"></span>
    <button class="ibtn" id="refresh" aria-label="일정 새로고침"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></svg></button>
    <button class="pill" id="todayBtn">오늘</button>
  </header>
  <div class="status gut" id="status"></div>
  <main id="main"></main>
  <nav class="tabs gut" id="tabs">
    <button data-v="cal" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>달력</button>
    <button data-v="shift"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 0 1 13.7-5.6L20 8.5"/><path d="M20 4v4.5h-4.5"/><path d="M20 12a8 8 0 0 1-13.7 5.6L4 15.5"/><path d="M4 20v-4.5h4.5"/></svg>교대</button>
    <button data-v="set"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5.5 5.5l1.8 1.8M16.7 16.7l1.8 1.8M5.5 18.5l1.8-1.8M16.7 7.3l1.8-1.8"/></svg>설정</button>
  </nav>
</div>
<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ---------- utils ---------- */
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, "0");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const key = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;           // m: 0-based
const parse = k => { const [y, m, d] = k.split("-").map(Number); return { y, m: m - 1, d }; };
const dnum = k => { const p = parse(k); return Math.round(Date.UTC(p.y, p.m, p.d) / 864e5); };
const fromNum = n => { const t = new Date(n * 864e5); return key(t.getUTCFullYear(), t.getUTCMonth(), t.getUTCDate()); };
const dow = k => (((dnum(k) + 4) % 7) + 7) % 7;
const todayKey = () => { const t = new Date(); return key(t.getFullYear(), t.getMonth(), t.getDate()); };
const midnight = k => { const p = parse(k); return new Date(p.y, p.m, p.d).getTime(); };   // local 00:00 (ms)
const keyOf = ms => { const t = new Date(ms); return key(t.getFullYear(), t.getMonth(), t.getDate()); };
const WD = ["일", "월", "화", "수", "목", "금", "토"];
const hhmm = min => `${pad(Math.floor(min / 60))}:${pad(min % 60)}`;
const shortT = min => min % 60 ? `${Math.floor(min / 60)}:${pad(min % 60)}` : String(min / 60);
const hrs = min => { const h = min / 60; return (Number.isInteger(h) ? h : h.toFixed(1)) + "h"; };

/* ---------- settings (this device only) ---------- */
const CFG = "myoff.rest.v1", TOK = "myoff.rest.tok", CACHE = "myoff.rest.cache";
// OAuth client ID is public by design (only works from the authorized origin; not a secret).
const DEFAULT_CLIENT_ID = "706526816720-tcjp9djh0e53pbc4vs1d3rc5s5d5p335.apps.googleusercontent.com";
const HOLIDAY_CAL = "ko.south_korea#holiday@group.v.calendar.google.com";
function defaults() {
  return {
    clientId: DEFAULT_CLIENT_ID,
    people: [
      { name: "엄지", color: "#f08a24", src: "" },     // src: "" auto | "cal:<id>" | "kw:<text>"
      { name: "도연", color: "#7c5cff", src: "" }
    ],
    minH: 4, qs: 0, qe: 9,
    allDay: "busy",                                     // all-day events: busy | ignore
    restWords: "휴무, 휴가, 연차, 휴일, 쉬는날, 비번, off",
    shiftAnchor: "2026-10-31",                         // a day that is 주 (cycle 주·야·비·휴)
    demo: false
  };
}
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
let S = Object.assign(defaults(), lsGet(CFG, {}));
if (!S.clientId) S.clientId = DEFAULT_CLIENT_ID;
const save = () => lsSet(CFG, S);
let tok = lsGet(TOK, null);                              // {token, exp}
const tokOk = () => tok && tok.exp > Date.now() + 60e3;

/* ---------- Korean public holidays (computed fallback, merged with Google's holiday calendar) ---------- */
const lunarFmt = (() => { try { return new Intl.DateTimeFormat("en-US-u-ca-chinese", { timeZone: "UTC", month: "numeric", day: "numeric" }); } catch (e) { return null; } })();
const lunarCache = {};
function lunar(k) {
  if (lunarCache[k]) return lunarCache[k];
  if (!lunarFmt) return null;
  const parts = lunarFmt.formatToParts(new Date(dnum(k) * 864e5));
  const mv = parts.find(p => p.type === "month").value, dv = parts.find(p => p.type === "day").value;
  return (lunarCache[k] = { m: parseInt(mv, 10), d: parseInt(dv, 10), leap: /\D/.test(mv) });
}
const yearCache = {};
function yearHolidays(y) {
  if (yearCache[y]) return yearCache[y];
  const H = {};
  const add = (k, n) => { (H[k] = H[k] || []).push(n); };
  const fixed = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
  for (const md in fixed) add(`${y}-${md}`, fixed[md]);
  const seol = [], chu = [];
  for (let n = dnum(`${y}-01-01`); n <= dnum(`${y}-12-31`); n++) {
    const k = fromNum(n), L = lunar(k); if (!L || L.leap) continue;
    const Ln = lunar(fromNum(n + 1));
    if ((L.m === 1 && (L.d === 1 || L.d === 2)) || (Ln && !Ln.leap && Ln.m === 1 && Ln.d === 1)) { add(k, "설날"); seol.push(k); }
    if (L.m === 8 && L.d >= 14 && L.d <= 16) { add(k, "추석"); chu.push(k); }
    if (L.m === 4 && L.d === 8) add(k, "부처님오신날");
  }
  const isOff = k => !!H[k];
  const nextFree = n => { while (isOff(fromNum(n)) || dow(fromNum(n)) === 0 || dow(fromNum(n)) === 6) n++; return fromNum(n); };
  const subs = [];
  [seol, chu].forEach(g => { if (g.length && g.some(k => dow(k) === 0 || H[k].length > 1)) subs.push(dnum(g[g.length - 1]) + 1); });
  for (const k in H) {
    const names = H[k];
    if (names.some(n => ["삼일절", "어린이날", "광복절", "개천절", "한글날", "부처님오신날", "성탄절"].includes(n)) &&
        !names.includes("설날") && !names.includes("추석") &&
        (dow(k) === 0 || dow(k) === 6 || names.length > 1)) subs.push(dnum(k) + 1);
  }
  subs.sort((a, b) => a - b).forEach(n => add(nextFree(n), "대체공휴일"));
  return (yearCache[y] = H);
}
let gHol = lsGet(CACHE, {}).hol || {};                    // {k: {name, red}} from Google
function holiday(k) {
  const c = yearHolidays(parse(k).y)[k];
  const g = gHol[k];
  if (g && g.red) return { name: g.name, red: true };
  if (c) return { name: c[0] === "대체공휴일" ? "대체휴일" : c[0], red: true };
  if (g) return { name: g.name, red: false };
  return null;
}

/* ---------- view state ---------- */
let view = "cal", sel = null;
let cur = (() => { const t = new Date(); return { y: t.getFullYear(), m: t.getMonth() }; })();
let D = null;                    // loaded data for current grid: {range:[k0,k1], people:[[ev..],..], at, srcLabel:[..]}
let loading = false, lastErr = "", calList = null;

function monthDays(y, m) {
  const first = key(y, m, 1), start = dnum(first) - dow(first);
  const last = new Date(y, m + 1, 0).getDate();
  const cells = Math.ceil((dow(first) + last) / 7) * 7;
  return Array.from({ length: cells }, (_, i) => fromNum(start + i));
}

/* ---------- Google sign-in (Google Identity Services, read-only scope) ---------- */
let gisReady = null, tokenClient = null;
function loadGis() {
  if (gisReady) return gisReady;
  gisReady = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client"; s.async = true;

    <li>만들어진 <b>클라이언트 ID</b>를 위 칸에 붙여넣고 ‘구글로 로그인’</li>
  </ol>
  <p class="muted" style="margin:4px 0 0">‘확인되지 않은 앱’ 경고가 나오면 고급 → 이동을 누르면 돼요(내가 만든 앱이라 안전).</p></div>`;
}

/* ---------- day sheet ---------- */
function track(ranges, cls, color) {
  const base = allowed();
  const x = minus([[0, 1440]], base).map(([a, b]) => `<i class="x" style="left:${a / 14.4}%;width:${(b - a) / 14.4}%"></i>`).join("");
  return `<div class="track">${x}${ranges.map(([a, b]) => `<i class="${cls}" style="left:${a / 14.4}%;width:${(b - a) / 14.4}%;${color ? `background:${esc(color)}` : ""}"></i>`).join("")}</div>`;
}
function renderSheet() {
  const k = sel, p = parse(k), w = dow(k), h = holiday(k), c = dayCalc(k);
  const ticks = [0, 6, 9, 12, 15, 18, 21, 24].map(t => `<span style="left:${t / 24 * 100}%">${t}</span>`).join("");
  let body = `<p class="muted">일정을 불러오면 시간표가 보여요.</p>`;
  if (c) {
    body = `<div class="tl">${S.people.map((pp, i) => `<div class="tlr"><span class="n" style="color:${esc(pp.color)}">${esc(pp.name)}</span>${track(c.per[i].busy, "b", pp.color)}</div>`).join("")}
      <div class="tlr"><span class="n" style="color:var(--free)">같이</span>${track(c.free, "f")}</div>
      <div class="ticks">${ticks}</div></div>
    <h3>같이 쉬는 시간 <small class="muted">${S.minH}시간 이상</small></h3>
    ${c.slots.length ? `<div class="btns">${c.slots.map(s => `<span class="slot" style="font-size:14px;padding:3px 10px">${slotLong(s)} · ${hrs(s[1] - s[0])}</span>`).join("")}</div>`
      : `<p class="muted" style="margin:0">없어요${c.free.length ? ` (짧은 빈 시간: ${c.free.map(slotLong).join(", ")})` : ""}</p>`}
    ${S.people.map((pp, i) => { const q = c.per[i]; return `<h3><i class="pdot" style="background:${esc(pp.color)}"></i>${esc(pp.name)} 일정</h3>
      ${q.list.length ? `<div>${q.list.map(e => `<div class="ev"><span class="t">${e.all ? "종일" : `${e.cs ? "←" : ""}${hhmm(e.a)}–${hhmm(e.b)}${e.ce ? "→" : ""}`}</span><span class="nm">${esc(e.t)}</span>${e.rest ? `<span class="tag g">쉬는 날</span>` : e.free ? `<span class="tag">비어있음 처리</span>` : ""}</div>`).join("")}</div>`
        : `<p class="muted" style="margin:0">일정 없음</p>`}`; }).join("")}`;
  }
  $("#sheet").innerHTML = `<div class="grab"></div>
  <div class="shead gut">
    <button class="ibtn" data-nav="-1" aria-label="전날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
    <div class="info">
      <div class="sdate ${(h && h.red) || w === 0 ? "red" : w === 6 ? "blue" : ""}">${p.m + 1}월 ${pad(p.d)}일 ${WD[w]}요일 <span class="pill" style="font-size:13px;vertical-align:middle">${SHIFT_NAMES[shiftIdx(k)]}</span></div>
      <div class="muted">${h ? esc(h.name) + " · " : ""}${c ? (c.full ? "둘 다 일정 없는 날" : c.work ? "둘 다 일하는 날" : c.slots.length ? `같이 ${hrs(c.total)}` : "같이 비는 긴 시간 없음") : ""}</div>
    </div>
    <button class="ibtn" data-nav="1" aria-label="다음날"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    <button class="mini pill" id="closeSheet">닫기</button>
  </div>
  <div class="sbody gut">${body}</div>`;
}
function openDay(k) { sel = k; $("#scrim").hidden = false; renderSheet(); }
function closeDay() { $("#scrim").hidden = true; sel = null; }
$("#sheet").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.id === "closeSheet") return closeDay();
  if (b.dataset.nav) {
    const nk = fromNum(dnum(sel) + +b.dataset.nav), np = parse(nk);
    sel = nk;
    if (np.m !== cur.m || np.y !== cur.y) { const [r0, r1] = viewRange(); if (nk < r0 || nk > r1) { cur = { y: np.y, m: np.m }; render(); load(false); return; } }
    renderSheet();
  }
});
$("#scrim").addEventListener("click", e => { if (e.target.id === "scrim") closeDay(); });
document.addEventListener("keydown", e => { if (e.key === "Escape" && sel) closeDay(); });

/* ---------- settings events ---------- */
async function connect() {
  try { await signIn(); lastErr = ""; await getCalList(); } catch (e) { lastErr = e.message; toast(e.message); }
  render(); load(false);
}
$("#main").addEventListener("click", async e => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.k) return openDay(b.dataset.k);
  const a = b.dataset.act;
  if (a === "goSet") { view = "set"; render(); }
  else if (a === "demoOn" || a === "demoToggle") { S.demo = a === "demoOn" ? true : !S.demo; save(); if (S.demo) view = "cal"; D = null; render(); load(false); }
  else if (a === "connect") connect();
  else if (a === "signOut") signOut();
  else if (a === "loadCals") { calList = null; try { await getCalList(); } catch (er) { toast(er.message === "AUTH" ? "다시 로그인해 주세요" : er.message); } render(); }
  else if (b.dataset.allday) { S.allDay = b.dataset.allday; save(); render(); }
});
$("#main").addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.f) {
    const f = t.dataset.f;
    if (f === "minH") S.minH = Math.max(0.5, Math.min(24, parseFloat(t.value) || 4));
    else if (f === "qs" || f === "qe") S[f] = +t.value;
    else if (f === "clientId") S.clientId = t.value.trim() || DEFAULT_CLIENT_ID;
    else if (f === "shiftAnchor") { if (/^\d{4}-\d{2}-\d{2}$/.test(t.value)) S.shiftAnchor = t.value; }
    else S[f] = t.value.trim();
    if (f === "clientId") { tok = null; localStorage.removeItem(TOK); calList = null; }
    save(); render(); return;
  }
  if (t.dataset.p) {
    const p = S.people[+t.dataset.p], f = t.dataset.pf;
    if (f === "name") { const old = p.name; p.name = t.value.trim() || old; if (p.src === "kw:" + old) p.src = "kw:" + p.name; }
    else p[f] = t.value;
    save(); D = f === "src" && !S.demo ? null : D; render(); if (f === "src") load(false);
  }
});

/* ---------- navigation ---------- */
function shiftMonth(d) { const t = new Date(cur.y, cur.m + d, 1); cur = { y: t.getFullYear(), m: t.getMonth() }; D = null; render(); load(false); }
$("#prev").onclick = () => shiftMonth(-1);
$("#next").onclick = () => shiftMonth(1);
const goToday = () => { const t = new Date(); if (cur.y === t.getFullYear() && cur.m === t.getMonth()) return; cur = { y: t.getFullYear(), m: t.getMonth() }; D = null; render(); load(false); };
$("#ym").onclick = goToday; $("#todayBtn").onclick = goToday;
$("#refresh").onclick = () => load(true);
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (!b) return; view = b.dataset.v; render(); $("#main").scrollTop = 0; });
let tx = null, ty = null;
$("#main").addEventListener("touchstart", e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
$("#main").addEventListener("touchend", e => {
  if (tx == null || view === "set") return;
  const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; tx = null;
  if (Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy) * 1.5) shiftMonth(dx < 0 ? 1 : -1);
}, { passive: true });
// refetch when the app comes back to the foreground (so it always shows the current schedule)
document.addEventListener("visibilitychange", () => { if (!document.hidden && D && Date.now() - D.at > 5 * 60e3) load(false); });

let toastT;
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- demo data (fake shifts for previewing the screen) ---------- */
function demoData(tMin, tMax) {
  const P = [[], []];
  const at = (k, h, m = 0) => midnight(k) + (h * 60 + m) * 6e4;
  for (let n = dnum(keyOf(tMin)); n < dnum(keyOf(tMax)); n++) {
    const k = fromNum(n), w = dow(k), r = (n * 7919) % 13;
    const sh = ((n % 4) + 4) % 4;                            // 엄지: 4조2교대 주·야·비·휴
    if (sh === 0) P[0].push({ t: "주간근무", s: at(k, 8), e: at(k, 20), all: false });
    if (sh === 1) P[0].push({ t: "야간근무", s: at(k, 20), e: at(fromNum(n + 1), 8), all: false });
    if (sh === 3 && r < 3) P[0].push({ t: "휴무", s: midnight(k), e: midnight(fromNum(n + 1)), all: true });
    if (w >= 1 && w <= 5 && !holiday(k)) P[1].push({ t: "회사", s: at(k, 9), e: at(k, 18), all: false });   // 도연: 평일 9-18
    if (r === 5) P[1].push({ t: "약속", s: at(k, 19), e: at(k, 22), all: false });
    if (r === 9 && (w === 0 || w === 6)) P[1].push({ t: "운동", s: at(k, 10), e: at(k, 12), all: false });
  }
  return P;
}

render();
load(false);
if ("serviceWorker" in navigator && location.protocol === "https:") { navigator.serviceWorker.register("sw.js").catch(() => {}); }
</script>
</body>
</html>
